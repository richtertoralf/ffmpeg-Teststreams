# ============================
# /etc/ffmpeg_streams/streams.conf
# ============================

# Globale Defaults (für alle Streams)
WIDTH=1920
HEIGHT=1080
PRESET=ultrafast
DEFAULT_PORT=8890
SRT_LATENCY_MS=2000

# Streams (NAME;TYPE;FPS;BITRATE;TARGET_HOST;TARGET_PORT;AUDIO[;SRT_LATENCY_MS])
# AUDIO = yes nur für: basic, motion, smptebars, sport

testpattern-basic;basic;30;2M;10.77.0.108;8890;yes
testpattern-smptebars;smptebars;30;3M;10.77.0.108;8890;yes
testpattern-motion;motion;30;4M;10.77.0.108;8890;yes
testpattern-noise;noise;30;5M;10.77.0.108;8890;no
testpattern-black;black;30;1M;10.77.0.108;8890;no
testpattern-clock;clock;30;3M;10.77.0.108;8890;no
testpattern-sport-motion;sport-motion;50;4M;10.77.0.108;8890;no
testpattern-smpte-noise;smpte-noise;30;2M;10.77.0.108;8890;no
testpattern-full-noise;full-noise;30;1M;10.77.0.108;8890;no
testpattern-sport;sport;60;2M;10.77.0.108;8890;yes
testpattern-scoreboard;scoreboard;50;4M;10.77.0.108;8890;no

# WireGuard / langer WAN-Pfad
testpattern-basic-wg;basic;30;2M;172.16.90.123;8890;yes
testpattern-smptebars-wg;smptebars;30;3M;172.16.90.123;8890;yes
testpattern-motion-wg;motion;30;4M;172.16.90.123;8890;yes
testpattern-sport-wg;sport;60;2M;172.16.90.123;8890;yes
